@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#ececea;--mut:#9a9a94;--card:#222226;--bd:#3a3a40;--ac:#6ea0ff;--ok:#5cc48a;--no:#ef8a69}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#ececea;--mut:#9a9a94;--card:#222226;--bd:#3a3a40;--ac:#6ea0ff;--ok:#5cc48a;--no:#ef8a69}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.stat{color:var(--mut);font-size:14px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;user-select:none}
.v{font-size:40px;font-weight:700;word-break:break-word}
.p{font-size:20px;color:var(--mut);margin-top:8px}
.a{font-size:28px;font-weight:600}
.h{font-size:13px;color:var(--mut);margin-top:16px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.nav .no{color:var(--no)}.nav .ok{color:var(--ok)}
</style>

let words=[],seen=new Set();
for(const k of ['a','c','b'])for(const l of RAW[k].split('\n')){const [v,m,p]=l.split('|');words.push({v,m,p,k,id:k+':'+words.length});}
const NM={a:'Hal 10-14',c:'Hal 15-19',b:'Hal 20-24'};
const SETS={all:'Semua ('+words.length+')'};
for(const k of ['a','c','b'])SETS[k]=NM[k]+' ('+words.filter(w=>w.k===k).length+')';
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem('dv-known')||'[]'));}catch(e){}
words.forEach(w=>{if(known.has(w.v))known.add(w.id);});
const save=()=>{try{localStorage.setItem('dv-known',JSON.stringify([...known]));}catch(e){}};
let set='all',onlyUnk=false,deck=[],i=0,flip=false;
const $=id=>document.getElementById(id);
function build(keepOrder){
 deck=words.filter(w=>(set==='all'||w.k===set)&&(!onlyUnk||!known.has(w.id)));
 i=0;flip=false;render();
}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function render(){
 const pool=words.filter(w=>set==='all'||w.k===set);
 const kn=pool.filter(w=>known.has(w.id)).length;
 $('stat').textContent=deck.length?`Kartu ${i+1} dari ${deck.length} · Hafal ${kn}/${pool.length}`:`Semua kartu sudah hafal 🎉 (${kn}/${pool.length})`;
 const c=$('card');
 if(!deck.length){c.innerHTML='<div class="a">Selesai!</div><div class="h">Tekan Reset atau matikan filter untuk mengulang.</div>';return;}
 const w=deck[i];
 c.innerHTML=flip?`<div class="a">${w.m}</div><div class="p">${w.v} ${w.p}</div><div class="h">ketuk untuk membalik</div>`:`<div class="v">${w.v}</div><div class="p">${w.p}</div><div class="h">ketuk untuk melihat arti · <u id="spk">🔊 dengar</u></div>`;
 const s=$('spk');if(s)s.onclick=e=>{e.stopPropagation();speak(w.v);};
}
function go(d){if(!deck.length)return;i=(i+d+deck.length)%deck.length;flip=false;render();}
$('card').onclick=()=>{if(deck.length){flip=!flip;render();}};
$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);
$('ok').onclick=()=>{if(!deck.length)return;known.add(deck[i].id);save();if(onlyUnk){deck.splice(i,1);if(i>=deck.length)i=0;flip=false;render();}else go(1);};
$('no').onclick=()=>{if(!deck.length)return;known.delete(deck[i].id);save();go(1);};
$('shuf').onclick=()=>{for(let j=deck.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[deck[j],deck[r]]=[deck[r],deck[j]];}i=0;flip=false;render();};
$('unk').onclick=()=>{onlyUnk=!onlyUnk;$('unk').classList.toggle('on',onlyUnk);build();};
$('rst').onclick=()=>{known=new Set();save();onlyUnk=false;$('unk').classList.remove('on');build();};
for(const k in SETS){const b=document.createElement('button');b.textContent=SETS[k];if(k===set)b.className='on';b.onclick=()=>{set=k;[...$('sets').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');build();};$('sets').appendChild(b);}
build();
