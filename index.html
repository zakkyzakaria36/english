<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Verbs ala ZX</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* 1. Efek Perspektif 3D */
    .perspective {
      perspective: 1200px;
      -webkit-perspective: 1200px;
    }

    /* 2. Container Dalam Kartu */
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Rotasi saat kartu diklik */
    .flipped .card-inner {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }

    /* 3. Sisi Kartu (Depan & Belakang) */
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1.5rem;
    }

    /* KUNCI: Putar sisi belakang 180deg lebih awal agar teks TIDAK cermin */
    .card-back {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 selection:bg-indigo-500 selection:text-white">

  <!-- TOP HEADER -->
  <header class="w-full max-w-md pt-4 flex flex-col items-center gap-3 text-center">
    <!-- Title -->
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-layer-group text-sm"></i>
      </div>
      <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">
        Daily Verbs ala ZX
      </h1>
    </div>

    <!-- Progress Bar & Counter -->
    <div class="w-full bg-slate-900/80 p-3 rounded-2xl border border-slate-800 shadow-inner">
      <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
        <span class="font-medium text-slate-300"><i class="fa-regular fa-bookmark mr-1"></i> Progres Belajar</span>
        <span id="cardCounter" class="font-bold text-indigo-400">1 / 12</span>
      </div>
      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full w-0 transition-all duration-300"></div>
      </div>
    </div>
  </header>

  <!-- FLASHCARD CONTAINER -->
  <main class="w-full max-w-sm sm:max-w-md my-auto py-6">
    <div id="flashcard" class="perspective w-full h-[340px] cursor-pointer" onclick="flipCard()">
      <div class="card-inner shadow-2xl">

        <!-- SISI DEPAN (Pertanyaan) -->
        <div class="card-front bg-slate-900/90 border border-slate-800/80 backdrop-blur-xl flex flex-col justify-between items-center p-6 text-center rounded-3xl shadow-indigo-500/10 hover:border-indigo-500/40 transition-colors">
          <div class="w-full flex justify-between items-center">
            <span class="text-[10px] font-semibold tracking-wider uppercase bg-indigo-500/10 text-indigo-400 px-3 py-1 rounded-full border border-indigo-500/20">
              English Verb
            </span>
            <i class="fa-solid fa-volume-high text-slate-500 hover:text-indigo-400 text-sm transition-colors" title="Audio"></i>
          </div>

          <div class="my-auto">
            <p id="cardQuestion" class="text-4xl font-extrabold tracking-tight text-white mb-2">
              Accept
            </p>
            <p class="text-xs text-slate-500 font-medium">Bentuk Kata Kerja Dasar (V1)</p>
          </div>

          <div class="text-xs text-slate-400 flex items-center gap-1.5 animate-pulse">
            <i class="fa-solid fa-arrows-rotate text-[10px]"></i>
            <span>Ketuk kartu untuk lihat arti</span>
          </div>
        </div>

        <!-- SISI BELAKANG (Jawaban) -->
        <div class="card-back bg-gradient-to-br from-indigo-950/80 via-slate-900 to-purple-950/80 border border-indigo-500/30 backdrop-blur-xl flex flex-col justify-between items-center p-6 text-center rounded-3xl shadow-indigo-500/20">
          <div class="w-full flex justify-between items-center">
            <span class="text-[10px] font-semibold tracking-wider uppercase bg-purple-500/10 text-purple-300 px-3 py-1 rounded-full border border-purple-500/20">
              Terjemahan & V2/V3
            </span>
            <i class="fa-solid fa-check text-emerald-400 text-sm"></i>
          </div>

          <div class="my-auto">
            <p id="cardAnswer" class="text-xl font-bold text-slate-100 leading-relaxed whitespace-pre-line">
              Menerima
              <span class="block text-sm font-normal text-indigo-300 mt-2">(V2: Accepted | V3: Accepted)</span>
            </p>
          </div>

          <div class="text-xs text-slate-400 flex items-center gap-1.5">
            <i class="fa-solid fa-arrows-rotate text-[10px]"></i>
            <span>Ketuk untuk kembali ke pertanyaan</span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- BOTTOM NAVIGATION CONTROLS -->
  <footer class="w-full max-w-xs sm:max-w-sm pb-6">
    <div class="bg-slate-900/90 border border-slate-800 backdrop-blur-md p-2 rounded-full flex justify-between items-center shadow-xl">
      <!-- Tombol Sebelum -->
      <button onclick="prevCard()" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition-all active:scale-95">
        <i class="fa-solid fa-arrow-left"></i>
      </button>

      <!-- Tombol Putar (Flip) -->
      <button onclick="flipCard()" class="px-6 py-3 rounded-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium text-xs tracking-wider uppercase shadow-lg shadow-indigo-500/25 flex items-center gap-2 active:scale-95 transition-all">
        <i class="fa-solid fa-rotate"></i>
        <span>Balik</span>
      </button>

      <!-- Tombol Selanjutnya -->
      <button onclick="nextCard()" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition-all active:scale-95">
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Data Flashcard Kosakata Daily Verbs
    const flashcards = [
      { question: "Accept", answer: "Menerima\n(V2: Accepted | V3: Accepted)" },
      { question: "Achieve", answer: "Mencapai / Meraih\n(V2: Achieved | V3: Achieved)" },
      { question: "Allow", answer: "Mengizinkan\n(V2: Allowed | V3: Allowed)" },
      { question: "Apologize", answer: "Meminta Maaf\n(V2: Apologized | V3: Apologized)" },
      { question: "Appreciate", answer: "Menghargai\n(V2: Appreciated | V3: Appreciated)" },
      { question: "Avoid", answer: "Menghindari\n(V2: Avoided | V3: Avoided)" },
      { question: "Borrow", answer: "Meminjam\n(V2: Borrowed | V3: Borrowed)" },
      { question: "Choose", answer: "Memilih\n(V2: Chose | V3: Chosen)" },
      { question: "Decide", answer: "Memutuskan\n(V2: Decided | V3: Decided)" },
      { question: "Encourage", answer: "Mendorong / Memberi Semangat\n(V2: Encouraged | V3: Encouraged)" },
      { question: "Improve", answer: "Meningkatkan / Memperbaiki\n(V2: Improved | V3: Improved)" },
      { question: "Understand", answer: "Memahami\n(V2: Understood | V3: Understood)" }
    ];

    let currentIndex = 0;

    // Memutar Kartu (Toggle Class)
    function flipCard() {
      const card = document.getElementById("flashcard");
      card.classList.toggle("flipped");
    }

    // Memperbarui Tampilan Kartu & Indikator
    function updateCard() {
      const card = document.getElementById("flashcard");
      
      // Kembalikan ke posisi depan dulu jika sedang terbuka di belakang
      card.classList.remove("flipped");

      setTimeout(() => {
        const item = flashcards[currentIndex];
        document.getElementById("cardQuestion").innerText = item.question;
        document.getElementById("cardAnswer").innerText = item.answer;

        // Update Counter
        document.getElementById("cardCounter").innerText = `${currentIndex + 1} / ${flashcards.length}`;

        // Update Progress Bar
        const progressPercent = ((currentIndex + 1) / flashcards.length) * 100;
        document.getElementById("progressBar").style.width = `${progressPercent}%`;
      }, 150);
    }

    // Navigasi Lanjut
    function nextCard() {
      currentIndex = (currentIndex + 1) % flashcards.length;
      updateCard();
    }

    // Navigasi Kembali
    function prevCard() {
      currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
      updateCard();
    }

    // Inisialisasi awal saat halaman dimuat
    updateCard();
  </script>
</body>
</html>
